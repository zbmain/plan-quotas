[project]
name = "plan-quotas"
version = "0.0.5"
description = "Self-hosted AI subscription quota dashboard"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "cryptography>=44", "pydantic-settings>=2.7,<3", "mcp>=1.12,<2", "typer>=0.15,<1"]

[dependency-groups]
dev = ["ruff>=0.11", "pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan_quotas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real local network listener or external integration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
plan-quotas = "plan_quotas.cli:app"
